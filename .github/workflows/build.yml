name: Build Android APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build APK
        id: build
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
          build-version: "1.0.0"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OmniAuditor-APK
          path: ${{ steps.build.outputs.archive-path }}
